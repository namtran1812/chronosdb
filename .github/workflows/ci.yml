name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy \
            --all-targets \
            --all-features \
            -- \
            -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Run crash recovery suite
        run: |
          for i in {1..5}; do
            echo "===== CRASH RECOVERY RUN $i ====="
            cargo test \
              --test crash_recovery \
              --all-features \
              --quiet
          done

      - name: Compile benchmarks
        run: cargo bench --bench engine --no-run
